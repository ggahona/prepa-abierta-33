<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepa Abierta 33 | Recursos educativos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      color: #2c4966;
      padding: 2rem 1rem;
      line-height: 1.6;
    }
    .contenedor { max-width: 720px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #e0e7ef;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: #2c4966;
    }
    .descripcion {
      color: #5b7fa3;
      font-size: 1rem;
      max-width: 480px;
      margin: 0 auto;
    }
    h2 {
      font-size: 1.1rem;
      color: #5b7fa3;
      font-weight: 500;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    ul { list-style: none; }
    li {
      background: #fff;
      margin-bottom: 0.75rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(44, 73, 102, 0.08);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    li:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(44, 73, 102, 0.12);
    }
    a {
      display: block;
      padding: 1.1rem 1.25rem;
      color: #2c4966;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { color: #5b7fa3; }
    .asignatura {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .icono {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.2rem;
      height: 2.2rem;
      background: #e8eef5;
      border-radius: 50%;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #e0e7ef;
      color: #8fa4bd;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>Prepa Abierta 33</h1>
      <p class="descripcion">Recursos educativos interactivos para las asignaturas del plan de estudios.</p>
    </header>

    <h2>Asignaturas</h2>
    <ul>
      <li>
        <a href="31-matematicas-iii/" class="asignatura">
          <span class="icono">📐</span>
          <span>Matemáticas III</span>
        </a>
      </li>
      <!-- Agrega aquí más asignaturas cuando las tengas:
      <li>
        <a href="32-matematicas-iv/" class="asignatura">
          <span class="icono">📊</span>
          <span>Matemáticas IV</span>
        </a>
      </li>
      -->
    </ul>

    <footer>
      Prepa Abierta 33 · Recursos en construcción
    </footer>
  </div>
</body>
</html>
