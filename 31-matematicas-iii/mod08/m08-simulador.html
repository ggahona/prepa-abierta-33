<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Autoevaluación - Módulo 8: Raíces Cuadradas, Representación Geométrica y Valor Absoluto</title>
    <style>
        :root {
            --bg-base: #e8eef5;
            --accent-soft: #a9c1d9;
            --accent-main: #5b7fa3;
            --text-primary: #2c4966;
            --success: #27ae60;
            --success-text: #145a32;
            --error: #c0392b;
            --error-text: #78281f;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --text-dark: #1a2a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(44, 73, 102, 0.12);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--bg-base);
            padding-bottom: 15px;
        }

        header .institution {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-main);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        header h1 {
            font-size: 1.35rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 1rem;
            color: var(--accent-main);
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            background-color: var(--bg-base);
            height: 10px;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-main);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-view {
            display: block;
        }

        .quiz-view.hidden {
            display: none;
        }

        .question-meta {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-main);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.12rem;
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .options-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .option-item {
            background: var(--bg-base);
            border: 2px solid var(--accent-soft);
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.8;
        }

        .option-item:hover:not(.disabled) {
            background-color: var(--accent-soft);
            border-color: var(--accent-main);
        }

        .option-item:focus {
            outline: 3px solid var(--accent-main);
            outline-offset: 2px;
        }

        .option-item.disabled {
            cursor: default;
        }

        .option-item.es-correcta {
            background-color: rgba(39, 174, 96, 0.2);
            border-color: var(--success);
            color: var(--success-text);
            font-weight: 600;
        }

        .option-item.es-incorrecta {
            background-color: rgba(192, 57, 43, 0.2);
            border-color: var(--error);
            color: var(--error-text);
            font-weight: 600;
        }

        .feedback-box {
            background-color: var(--bg-base);
            border-left: 5px solid var(--accent-main);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .feedback-box.visible {
            display: block;
        }

        .feedback-box strong {
            color: var(--accent-main);
        }

        .btn-next {
            background-color: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            float: right;
            transition: background-color 0.2s;
            display: none;
        }

        .btn-next.visible {
            display: block;
        }

        .btn-next:hover {
            background-color: var(--text-primary);
        }

        .btn-next:focus {
            outline: 3px solid var(--accent-main);
            outline-offset: 2px;
        }

        .results-view {
            text-align: center;
            display: none;
        }

        .results-view.visible {
            display: block;
        }

        .results-view h2 {
            color: var(--text-primary);
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-main);
            margin: 20px 0;
        }

        .results-message {
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.6;
            color: var(--text-dark);
            text-align: justify;
        }

        .btn-restart {
            background-color: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-restart:hover {
            background-color: var(--text-primary);
        }

        .btn-restart:focus {
            outline: 3px solid var(--accent-main);
            outline-offset: 2px;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.05rem; }
            .container { padding: 20px; }
            .question-text { font-size: 1rem; }
            .score-display { font-size: 2.4rem; }
        }
    </style>
    <!-- MathJax 3 Configuration — SOLO delimitadores $ ... $ y $$ ... $$ -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']]
            },
            svg: {
                fontCache: 'global'
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <div class="institution">Preparatoria Abierta</div>
            <h1>Simulador de Autoevaluación: Módulo 8</h1>
            <p>Raíces Cuadradas, Representación Geométrica y Valor Absoluto</p>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar" role="progressbar" aria-label="Progreso del simulador" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>

        <!-- Vista del Quiz -->
        <div id="quizView" class="quiz-view clearfix">
            <div class="question-meta" id="questionMeta">Reactivo 1 de 10</div>
            <div class="question-text" id="questionText">Cargando pregunta...</div>
            <ul class="options-list" id="optionsList" role="list"></ul>
            <div class="feedback-box" id="feedbackBox" role="status" aria-live="polite"></div>
            <button class="btn-next" id="btnNext" onclick="nextQuestion()" aria-label="Avanzar al siguiente reactivo">Siguiente Reactivo →</button>
        </div>

        <!-- Vista de Resultados -->
        <div id="resultsView" class="results-view">
            <h2>Evaluación Finalizada</h2>
            <div class="score-display" id="finalScore">0/10</div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="btn-restart" onclick="restartQuiz()" aria-label="Reiniciar la evaluación">Intentar de nuevo</button>
        </div>
    </div>

    <script>
        // =========================================
        // BANCO DE REACTIVOS — Módulo 8
        // =========================================
        const rawQuestions = [
            {
                id: 1,
                text: "¿Cuáles son las raíces cuadradas de $-1$ y cómo se justifican?",
                options: [
                    { text: "$\\pm 1$, porque $1^2 = 1$ y $(-1)^2 = 1$.", correct: false },
                    { text: "$\\pm i$, porque $i^2 = -1$ y $(-i)^2 = -1$.", correct: true },
                    { text: "$\\pm \\sqrt{1}\\,i$, que equivale a $\\pm i$.", correct: false },
                    { text: "$0$ y $-1$, porque $-1$ no tiene raíz en los reales.", correct: false }
                ],
                feedback: "Las raíces cuadradas de $-1$ son $\\pm i$, ya que $i^2 = -1$ y $(-i)^2 = (-1)^2 \\cdot i^2 = -1$. Simbólicamente: $\\sqrt{-1} = i$ y $-\\sqrt{-1} = -i$."
            },
            {
                id: 2,
                text: "¿Cuál es el conjunto solución de la ecuación $x^2 = -16$ en el conjunto de los números complejos?",
                options: [
                    { text: "$\\{-4,\\ 4\\}$", correct: false },
                    { text: "$\\{-4i,\\ 4i\\}$", correct: true },
                    { text: "$\\{-16i,\\ 16i\\}$", correct: false },
                    { text: "$\\{-2i,\\ 2i\\}$", correct: false }
                ],
                feedback: "Despejando: $x = \\pm\\sqrt{-16} = \\pm\\sqrt{(-1)(16)} = \\pm\\sqrt{-1}\\cdot\\sqrt{16} = \\pm 4i$. El conjunto solución es $\\{-4i, 4i\\}$."
            },
            {
                id: 3,
                text: "¿Cuál es el resultado del producto $\\sqrt{-25} \\cdot \\sqrt{-16}$?",
                options: [
                    { text: "$20$", correct: false },
                    { text: "$-20$", correct: true },
                    { text: "$20i$", correct: false },
                    { text: "$-20i$", correct: false }
                ],
                feedback: "NO se puede aplicar $\\sqrt{a}\\cdot\\sqrt{b} = \\sqrt{ab}$ cuando ambos radicandos son negativos. Se convierte primero: $\\sqrt{-25} = 5i$ y $\\sqrt{-16} = 4i$. Luego: $(5i)(4i) = 20i^2 = 20(-1) = -20$."
            },
            {
                id: 4,
                text: "¿Cuál es el resultado de la suma $\\sqrt{-25} + \\sqrt{-16}$?",
                options: [
                    { text: "$9i$", correct: true },
                    { text: "$-9i$", correct: false },
                    { text: "$9$", correct: false },
                    { text: "$\\sqrt{-41}$", correct: false }
                ],
                feedback: "Convirtiendo a la forma con $i$: $\\sqrt{-25} = 5i$ y $\\sqrt{-16} = 4i$. Sumando: $5i + 4i = 9i$."
            },
            {
                id: 5,
                text: "En el plano complejo, ¿cómo se llaman respectivamente el eje horizontal y el eje vertical?",
                options: [
                    { text: "Eje real y eje imaginario.", correct: true },
                    { text: "Eje imaginario y eje real.", correct: false },
                    { text: "Eje X y eje Y, sin nombres especiales.", correct: false },
                    { text: "Eje positivo y eje negativo.", correct: false }
                ],
                feedback: "En el plano complejo, el eje horizontal (eje X) se llama eje real y el eje vertical (eje Y) se llama eje imaginario. Cada punto $(a, b)$ representa el número complejo $z = a + bi$."
            },
            {
                id: 6,
                text: "¿Cómo se define el valor absoluto (o módulo) de un número complejo $z = a + bi$?",
                options: [
                    { text: "$|z| = a + b$", correct: false },
                    { text: "$|z| = \\sqrt{a^2 + b^2}$", correct: true },
                    { text: "$|z| = a^2 + b^2$", correct: false },
                    { text: "$|z| = |a| + |b|$", correct: false }
                ],
                feedback: "El valor absoluto de $z = a + bi$ es $|z| = \\sqrt{a^2 + b^2}$, que representa la distancia del punto $(a, b)$ al origen de coordenadas. Se obtiene aplicando el teorema de Pitágoras, pues $a$ y $b$ son los catetos del triángulo rectángulo."
            },
            {
                id: 7,
                text: "Calcula el valor absoluto del número complejo $z = \\sqrt{3} + \\sqrt{13}\\,i$.",
                options: [
                    { text: "$4$", correct: true },
                    { text: "$\\sqrt{16}\\,i$", correct: false },
                    { text: "$\\sqrt{13}$", correct: false },
                    { text: "$\\sqrt{10}$", correct: false }
                ],
                feedback: "Aplicando la fórmula: $|z| = \\sqrt{(\\sqrt{3})^2 + (\\sqrt{13})^2} = \\sqrt{3 + 13} = \\sqrt{16} = 4$. El valor absoluto es un número real no negativo."
            },
            {
                id: 8,
                text: "Si $z = \\dfrac{\\sqrt{3}}{2} - \\dfrac{1}{2}i$, ¿cuál es el valor de $|z|$?",
                options: [
                    { text: "$1$", correct: true },
                    { text: "$\\dfrac{\\sqrt{3} - 1}{2}$", correct: false },
                    { text: "$\\dfrac{\\sqrt{2}}{2}$", correct: false },
                    { text: "$\\dfrac{1}{2}$", correct: false }
                ],
                feedback: "Aplicando la fórmula: $|z| = \\sqrt{\\left(\\frac{\\sqrt{3}}{2}\\right)^2 + \\left(-\\frac{1}{2}\\right)^2} = \\sqrt{\\frac{3}{4} + \\frac{1}{4}} = \\sqrt{1} = 1$. Este punto está sobre la circunferencia unitaria $|z| = 1$."
            },
            {
                id: 9,
                text: "¿Qué figura geométrica describe la ecuación $|z| = 1$ en el plano complejo?",
                options: [
                    { text: "Una recta vertical que pasa por $x = 1$.", correct: false },
                    { text: "Una circunferencia unitaria centrada en el origen, de radio 1.", correct: true },
                    { text: "Un cuadrado de lado 1 centrado en el origen.", correct: false },
                    { text: "Una parábola con vértice en $(1, 0)$.", correct: false }
                ],
                feedback: "La ecuación $|z| = 1$ representa todos los números complejos que están a distancia 1 del origen. Geométricamente, esto es una circunferencia de radio 1 centrada en el origen. Algebraicamente: $x^2 + y^2 = 1$."
            },
            {
                id: 10,
                text: "¿Qué región del plano complejo describe la desigualdad $|z| \\leq 4$?",
                options: [
                    { text: "Únicamente la circunferencia de radio 4.", correct: false },
                    { text: "El disco cerrado de radio 4 centrado en el origen (incluye la frontera).", correct: true },
                    { text: "La región exterior a la circunferencia de radio 4.", correct: false },
                    { text: "Un cuadrado de lado 4.", correct: false }
                ],
                feedback: "La desigualdad $|z| \\leq 4$ incluye todos los puntos del plano complejo cuya distancia al origen es menor o igual a 4. Esto forma un disco cerrado de radio 4, que incluye la circunferencia frontera (debido al símbolo $\\leq$)."
            }
        ];

        // =========================================
        // ESTADO DEL SIMULADOR
        // =========================================
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // =========================================
        // ALGORITMO FISHER-YATES
        // =========================================
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // =========================================
        // RENDERIZAR MATHJAX
        // =========================================
        function renderMath(element) {
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise(element ? [element] : undefined).catch(function(err){ console.log(err); });
            } else if (window.MathJax && window.MathJax.typeset) {
                MathJax.typeset();
            }
        }

        // =========================================
        // LIMPIAR LATEX PARA ARIA-LABEL
        // =========================================
        function limpiarLatex(texto) {
            return String(texto)
                .replace(/\$[^$]*\$/g, '')
                .replace(/\\[a-zA-Z]+/g, '')
                .replace(/[{}]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // =========================================
        // INICIALIZAR QUIZ
        // =========================================
        function initQuiz() {
            questions = shuffleArray(rawQuestions).map(q => {
                return {
                    ...q,
                    options: shuffleArray(q.options)
                };
            });
            currentQuestionIndex = 0;
            score = 0;
            answered = false;
            document.getElementById('resultsView').classList.remove('visible');
            document.getElementById('quizView').classList.remove('hidden');
            loadQuestion();
        }

        // =========================================
        // CARGAR PREGUNTA ACTUAL
        // =========================================
        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestionIndex];

            document.getElementById('questionMeta').innerText = `Reactivo ${currentQuestionIndex + 1} de 10`;
            document.getElementById('questionText').innerHTML = q.text;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.setAttribute('role', 'button');
                li.setAttribute('tabindex', '0');
                li.setAttribute('aria-label', `Opción ${String.fromCharCode(97 + idx)}: ${limpiarLatex(opt.text)}`);
                li.innerHTML = `<strong>${String.fromCharCode(97 + idx)})</strong> ${opt.text}`;

                // Selección con ratón
                li.onclick = () => selectOption(opt.correct, li);

                // Selección con teclado (Enter o Espacio)
                li.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectOption(opt.correct, li);
                    }
                };

                optionsList.appendChild(li);
            });

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.className = 'feedback-box';
            feedbackBox.innerHTML = '';

            document.getElementById('btnNext').classList.remove('visible');
            updateProgress();

            renderMath(document.getElementById('quizView'));
        }

        // =========================================
        // SELECCIONAR OPCIÓN Y MOSTRAR RETROALIMENTACIÓN
        // =========================================
        function selectOption(isCorrect, selectedElement) {
            if (answered) return;
            answered = true;

            const optionItems = document.querySelectorAll('.option-item');
            optionItems.forEach(item => {
                item.classList.add('disabled');
                item.setAttribute('tabindex', '-1');
                item.setAttribute('aria-disabled', 'true');
            });

            if (isCorrect) {
                selectedElement.classList.add('es-correcta');
                selectedElement.setAttribute('aria-label', 'Opción correcta');
                score++;
            } else {
                selectedElement.classList.add('es-incorrecta');
                selectedElement.setAttribute('aria-label', 'Opción incorrecta');
                const q = questions[currentQuestionIndex];
                optionItems.forEach((item, idx) => {
                    if (q.options[idx].correct) {
                        item.classList.add('es-correcta');
                    }
                });
            }

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.innerHTML = `<strong>Explicación:</strong> ${questions[currentQuestionIndex].feedback}`;
            feedbackBox.classList.add('visible');

            const btnNext = document.getElementById('btnNext');
            if (currentQuestionIndex === questions.length - 1) {
                btnNext.innerText = "Ver Resultados Finales →";
                btnNext.setAttribute('aria-label', 'Ver resultados finales');
            } else {
                btnNext.innerText = "Siguiente Reactivo →";
                btnNext.setAttribute('aria-label', 'Avanzar al siguiente reactivo');
            }
            btnNext.classList.add('visible');
            btnNext.focus();

            renderMath(document.getElementById('quizView'));
        }

        // =========================================
        // SIGUIENTE PREGUNTA
        // =========================================
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // =========================================
        // ACTUALIZAR BARRA DE PROGRESO
        // =========================================
        function updateProgress() {
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            const bar = document.getElementById('progressBar');
            bar.style.width = `${progress}%`;
            bar.setAttribute('aria-valuenow', Math.round(progress));
        }

        // =========================================
        // MOSTRAR RESULTADOS FINALES
        // =========================================
        function showResults() {
            document.getElementById('quizView').classList.add('hidden');
            document.getElementById('resultsView').classList.add('visible');
            const bar = document.getElementById('progressBar');
            bar.style.width = '100%';
            bar.setAttribute('aria-valuenow', '100');

            document.getElementById('finalScore').innerText = `${score} / 10`;

            const msg = document.getElementById('resultsMessage');
            if (score === 10) {
                msg.innerText = "¡Excelente dominio! Has respondido correctamente todos los reactivos del Módulo 8 sobre raíces cuadradas de números negativos, representación geométrica y valor absoluto de números complejos.";
            } else if (score >= 7) {
                msg.innerText = "¡Buen trabajo! Tienes una sólida comprensión de las raíces cuadradas complejas y el valor absoluto. Repasa los detalles sobre el producto de raíces negativas y las regiones del plano definidas por desigualdades con módulo para alcanzar la perfección.";
            } else {
                msg.innerText = "Es recomendable repasar los conceptos del Módulo 8 (raíces cuadradas de números negativos, el cuidado con el producto de dos raíces negativas, la representación en el plano complejo, el valor absoluto como distancia y la circunferencia unitaria) antes de intentar nuevamente.";
            }

            renderMath(document.getElementById('resultsView'));
        }

        // =========================================
        // REINICIAR QUIZ
        // =========================================
        function restartQuiz() {
            initQuiz();
        }

        // =========================================
        // INICIALIZACIÓN AL CARGAR
        // =========================================
        window.onload = initQuiz;
    </script>
</body>
</html>
