<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Autoevaluación - Módulo 5: Números Complejos (Suma y Propiedades)</title>
    <style>
        :root {
            --bg-base: #e8eef5;
            --accent-soft: #a9c1d9;
            --accent-main: #5b7fa3;
            --text-primary: #2c4966;
            --success: #27ae60;
            --success-text: #145a32;
            --error: #c0392b;
            --error-text: #78281f;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --text-dark: #1a2a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(44, 73, 102, 0.12);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--bg-base);
            padding-bottom: 15px;
        }

        header .institution {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-main);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        header h1 {
            font-size: 1.45rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 1rem;
            color: var(--accent-main);
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            background-color: var(--bg-base);
            height: 10px;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-main);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-view {
            display: block;
        }

        .quiz-view.hidden {
            display: none;
        }

        .question-meta {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-main);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.12rem;
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .options-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .option-item {
            background: var(--bg-base);
            border: 2px solid var(--accent-soft);
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .option-item:hover:not(.disabled) {
            background-color: var(--accent-soft);
            border-color: var(--accent-main);
        }

        .option-item.disabled {
            cursor: default;
        }

        .option-item.es-correcta {
            background-color: rgba(39, 174, 96, 0.2);
            border-color: var(--success);
            color: var(--success-text);
            font-weight: 600;
        }

        .option-item.es-incorrecta {
            background-color: rgba(192, 57, 43, 0.2);
            border-color: var(--error);
            color: var(--error-text);
            font-weight: 600;
        }

        .feedback-box {
            background-color: var(--bg-base);
            border-left: 5px solid var(--accent-main);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.55;
            color: var(--text-dark);
        }

        .feedback-box.visible {
            display: block;
        }

        .feedback-box strong {
            color: var(--accent-main);
        }

        .btn-next {
            background-color: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            float: right;
            transition: background-color 0.2s;
            display: none;
        }

        .btn-next.visible {
            display: block;
        }

        .btn-next:hover {
            background-color: var(--text-primary);
        }

        .results-view {
            text-align: center;
            display: none;
        }

        .results-view.visible {
            display: block;
        }

        .results-view h2 {
            color: var(--text-primary);
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-main);
            margin: 20px 0;
        }

        .results-message {
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.6;
            color: var(--text-dark);
            text-align: justify;
        }

        .btn-restart {
            background-color: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-restart:hover {
            background-color: var(--text-primary);
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.15rem; }
            .container { padding: 20px; }
            .question-text { font-size: 1rem; }
            .score-display { font-size: 2.4rem; }
        }
    </style>
    <!-- MathJax 3 Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <div class="institution">Preparatoria Abierta</div>
            <h1>Simulador de Autoevaluación: Módulo 5</h1>
            <p>Números Complejos: Suma y Propiedades</p>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Vista del Quiz -->
        <div id="quizView" class="quiz-view clearfix">
            <div class="question-meta" id="questionMeta">Reactivo 1 de 10</div>
            <div class="question-text" id="questionText">Cargando pregunta...</div>
            <ul class="options-list" id="optionsList"></ul>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="btn-next" id="btnNext" onclick="nextQuestion()">Siguiente Reactivo →</button>
        </div>

        <!-- Vista de Resultados -->
        <div id="resultsView" class="results-view">
            <h2>Evaluación Finalizada</h2>
            <div class="score-display" id="finalScore">0/10</div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="btn-restart" onclick="restartQuiz()">Intentar de nuevo</button>
        </div>
    </div>

    <script>
        // =========================================
        // BANCO DE REACTIVOS — Módulo 5
        // =========================================
        const rawQuestions = [
            {
                id: 1,
                text: "¿Qué es un número complejo?",
                options: [
                    { text: "Cualquier número real que se pueda representar en la recta numérica.", correct: false },
                    { text: "Un par ordenado con componentes reales $(a, b)$, y recíprocamente cada par ordenado de números reales es un número complejo.", correct: true },
                    { text: "Una fracción con numerador y denominador entero.", correct: false },
                    { text: "Un número que siempre tiene raíz cuadrada exacta.", correct: false }
                ],
                feedback: "Un número complejo es un par ordenado con componentes reales $a, b$. El conjunto de los números complejos se denota por $\\mathbb{C} = \\{z \\mid z = (a, b); a, b \\in \\mathbb{R}\\}$."
            },
            {
                id: 2,
                text: "¿Cuál es la condición para que dos números complejos $z_1 = (a_1, b_1)$ y $z_2 = (a_2, b_2)$ sean iguales?",
                options: [
                    { text: "Basta con que $a_1 = a_2$ o que $b_1 = b_2$.", correct: false },
                    { text: "Se requiere que $a_1 = a_2$ y $b_1 = b_2$ simultáneamente.", correct: true },
                    { text: "Deben tener la misma suma de componentes: $a_1 + b_1 = a_2 + b_2$.", correct: false },
                    { text: "Deben tener el mismo producto: $a_1 b_1 = a_2 b_2$.", correct: false }
                ],
                feedback: "Dos números complejos son iguales si y sólo si tienen el mismo primer componente y también son iguales sus segundos componentes. Es decir, $z_1 = z_2 \\iff a_1 = a_2$ y $b_1 = b_2$."
            },
            {
                id: 3,
                text: "¿Cómo se define la suma de dos números complejos $z_1 = (a_1, b_1)$ y $z_2 = (a_2, b_2)$?",
                options: [
                    { text: "$z_1 + z_2 = (a_1 \\cdot a_2, \\ b_1 \\cdot b_2)$", correct: false },
                    { text: "$z_1 + z_2 = (a_1 + a_2, \\ b_1 + b_2)$", correct: true },
                    { text: "$z_1 + z_2 = (a_1 + b_2, \\ b_1 + a_2)$", correct: false },
                    { text: "$z_1 + z_2 = (a_1 - a_2, \\ b_1 - b_2)$", correct: false }
                ],
                feedback: "La suma se define componente a componente: $z_1 + z_2 = (a_1 + a_2, \\ b_1 + b_2)$. El resultado es otro número complejo, por lo que $\\mathbb{C}$ es cerrado respecto a la suma."
            },
            {
                id: 4,
                text: "Calcula el resultado de la operación $(1, 2) + (3, -4)$.",
                options: [
                    { text: "$(4, -2)$", correct: true },
                    { text: "$(4, 6)$", correct: false },
                    { text: "$(-2, 4)$", correct: false },
                    { text: "$(3, -8)$", correct: false }
                ],
                feedback: "Aplicando la definición: $(1, 2) + (3, -4) = (1 + 3, \\ 2 + (-4)) = (4, -2)$."
            },
            {
                id: 5,
                text: "¿Cuál es el elemento identidad para la suma de números complejos y por qué?",
                options: [
                    { text: "$(1, 0)$, porque al multiplicar cualquier complejo por él no cambia.", correct: false },
                    { text: "$(0, 0)$, porque al sumarlo a cualquier $(a, b)$ se obtiene de nuevo $(a, b)$.", correct: true },
                    { text: "$(0, 1)$, porque representa la unidad imaginaria.", correct: false },
                    { text: "$(a, b)$, porque cada número es su propio inverso.", correct: false }
                ],
                feedback: "El elemento identidad para la suma es $(0, 0)$, ya que $(a, b) + (0, 0) = (a + 0, \\ b + 0) = (a, b)$. El $(1, 0)$ es la identidad para la multiplicación, no para la suma."
            },
            {
                id: 6,
                text: "¿Cuál es el inverso aditivo del número complejo $(-7, 3)$?",
                options: [
                    { text: "$(7, -3)$", correct: true },
                    { text: "$(-7, -3)$", correct: false },
                    { text: "$(7, 3)$", correct: false },
                    { text: "$(0, 0)$", correct: false }
                ],
                feedback: "El inverso aditivo de $(a, b)$ es $(-a, -b)$, ya que $(a, b) + (-a, -b) = (0, 0)$. Para $(-7, 3)$, el inverso aditivo es $(7, -3)$."
            },
            {
                id: 7,
                text: "¿Qué propiedad se aplica al demostrar que $z_1 + (z_2 + z_3) = (z_1 + z_2) + z_3$ en el conjunto $\\mathbb{C}$?",
                options: [
                    { text: "La propiedad conmutativa de la suma en $\\mathbb{R}$.", correct: false },
                    { text: "La propiedad asociativa de la suma en $\\mathbb{R}$.", correct: true },
                    { text: "La propiedad distributiva de la multiplicación.", correct: false },
                    { text: "La propiedad del inverso multiplicativo.", correct: false }
                ],
                feedback: "La demostración de la propiedad asociativa en $\\mathbb{C}$ se apoya en el postulado asociativo de la suma en $\\mathbb{R}$, ya que las componentes $a_i, b_i$ son números reales. Es decir, $(a_1 + (a_2 + a_3)) = ((a_1 + a_2) + a_3)$ en $\\mathbb{R}$, y esto se traslada a $\\mathbb{C}$."
            },
            {
                id: 8,
                text: "Encuentra los valores de $x$ e $y$ si $(x, y) = (-1, 3) + (2, -4)$.",
                options: [
                    { text: "$x = 1$, $y = -1$", correct: true },
                    { text: "$x = -3$, $y = 7$", correct: false },
                    { text: "$x = 1$, $y = 7$", correct: false },
                    { text: "$x = -1$, $y = -1$", correct: false }
                ],
                feedback: "Aplicando la suma: $(x, y) = (-1 + 2, \\ 3 + (-4)) = (1, -1)$. Por la definición de igualdad, $x = 1$ y $y = -1$."
            },
            {
                id: 9,
                text: "Si $(-2, 1) = (-2, 1) + (x, y)$, ¿cuáles son los valores de $x$ e $y$?",
                options: [
                    { text: "$x = 0$, $y = 0$", correct: true },
                    { text: "$x = -4$, $y = 2$", correct: false },
                    { text: "$x = 1$, $y = 1$", correct: false },
                    { text: "$x = -2$, $y = 1$", correct: false }
                ],
                feedback: "El elemento $(x, y)$ que sumado a $(-2, 1)$ deja el mismo resultado es el elemento identidad $(0, 0)$: $(-2, 1) + (0, 0) = (-2, 1)$. Por lo tanto, $x = 0$ y $y = 0$."
            },
            {
                id: 10,
                text: "Considera el sistema de números complejos como un sistema matemático. ¿Cuál de las siguientes afirmaciones es verdadera respecto a la relación entre $\\mathbb{R}$ y $\\mathbb{C}$?",
                options: [
                    { text: "$\\mathbb{R}$ y $\\mathbb{C}$ son conjuntos disjuntos, sin elementos comunes.", correct: false },
                    { text: "$\\mathbb{R}$ es un subconjunto propio de $\\mathbb{C}$, y las operaciones de suma se comportan de la misma manera en ambos.", correct: true },
                    { text: "$\\mathbb{C}$ es un subconjunto de $\\mathbb{R}$.", correct: false },
                    { text: "$\\mathbb{R}$ contiene a $\\mathbb{C}$ como un subconjunto de mayor cardinalidad.", correct: false }
                ],
                feedback: "Una parte de $\\mathbb{C}$ tiene exactamente el mismo comportamiento que el conjunto de los números reales, por lo que podemos trabajar con $\\mathbb{R}$ como si fuera un subconjunto propio de $\\mathbb{C}$. La correspondencia natural es $a \\in \\mathbb{R} \\leftrightarrow (a, 0) \\in \\mathbb{C}$."
            }
        ];

        // =========================================
        // ESTADO DEL SIMULADOR
        // =========================================
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // =========================================
        // ALGORITMO FISHER-YATES
        // =========================================
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // =========================================
        // INICIALIZAR QUIZ
        // =========================================
        function initQuiz() {
            questions = shuffleArray(rawQuestions).map(q => {
                return {
                    ...q,
                    options: shuffleArray(q.options)
                };
            });
            currentQuestionIndex = 0;
            score = 0;
            answered = false;
            document.getElementById('resultsView').classList.remove('visible');
            document.getElementById('quizView').classList.remove('hidden');
            loadQuestion();
        }

        // =========================================
        // CARGAR PREGUNTA ACTUAL
        // =========================================
        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestionIndex];

            document.getElementById('questionMeta').innerText = `Reactivo ${currentQuestionIndex + 1} de 10`;
            document.getElementById('questionText').innerHTML = q.text;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `<strong>${String.fromCharCode(97 + idx)})</strong> ${opt.text}`;
                li.onclick = () => selectOption(opt.correct, li);
                optionsList.appendChild(li);
            });

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.className = 'feedback-box';
            feedbackBox.innerHTML = '';

            document.getElementById('btnNext').classList.remove('visible');
            updateProgress();

            if (window.MathJax) {
                MathJax.typeset();
            }
        }

        // =========================================
        // SELECCIONAR OPCIÓN Y MOSTRAR RETROALIMENTACIÓN
        // =========================================
        function selectOption(isCorrect, selectedElement) {
            if (answered) return;
            answered = true;

            const optionItems = document.querySelectorAll('.option-item');
            optionItems.forEach(item => {
                item.classList.add('disabled');
            });

            if (isCorrect) {
                selectedElement.classList.add('es-correcta');
                score++;
            } else {
                selectedElement.classList.add('es-incorrecta');
                const q = questions[currentQuestionIndex];
                optionItems.forEach((item, idx) => {
                    if (q.options[idx].correct) {
                        item.classList.add('es-correcta');
                    }
                });
            }

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.innerHTML = `<strong>Explicación:</strong> ${questions[currentQuestionIndex].feedback}`;
            feedbackBox.classList.add('visible');

            const btnNext = document.getElementById('btnNext');
            if (currentQuestionIndex === questions.length - 1) {
                btnNext.innerText = "Ver Resultados Finales →";
            } else {
                btnNext.innerText = "Siguiente Reactivo →";
            }
            btnNext.classList.add('visible');

            if (window.MathJax) {
                MathJax.typeset();
            }
        }

        // =========================================
        // SIGUIENTE PREGUNTA
        // =========================================
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // =========================================
        // ACTUALIZAR BARRA DE PROGRESO
        // =========================================
        function updateProgress() {
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        // =========================================
        // MOSTRAR RESULTADOS FINALES
        // =========================================
        function showResults() {
            document.getElementById('quizView').classList.add('hidden');
            document.getElementById('resultsView').classList.add('visible');
            document.getElementById('progressBar').style.width = '100%';

            document.getElementById('finalScore').innerText = `${score} / 10`;

            const msg = document.getElementById('resultsMessage');
            if (score === 10) {
                msg.innerText = "¡Excelente dominio! Has respondido correctamente todos los reactivos del Módulo 5 sobre números complejos, su definición, igualdad, suma y propiedades.";
            } else if (score >= 7) {
                msg.innerText = "¡Buen trabajo! Tienes una sólida comprensión de los números complejos y la operación de suma. Repasa los detalles sobre el elemento identidad, el inverso aditivo y la demostración de la propiedad asociativa para alcanzar la perfección.";
            } else {
                msg.innerText = "Es recomendable repasar los conceptos teóricos del Módulo 5 (definición de número complejo, igualdad de pares ordenados, suma componente a componente, elemento identidad y inverso aditivo) antes de intentar nuevamente.";
            }
        }

        // =========================================
        // REINICIAR QUIZ
        // =========================================
        function restartQuiz() {
            initQuiz();
        }

        // =========================================
        // INICIALIZACIÓN AL CARGAR
        // =========================================
        window.onload = initQuiz;
    </script>
</body>
</html>
