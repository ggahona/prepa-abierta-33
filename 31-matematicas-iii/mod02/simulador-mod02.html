<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Autoevaluación - Módulo 2: Sistemas de Ecuaciones Lineales</title>
    <style>
        :root {
            --bg-base: #e8eef5;
            --accent-soft: #a9c1d9;
            --accent-main: #5b7fa3;
            --text-primary: #2c4966;
            --success: #27ae60;
            --success-text: #145a32;
            --error: #c0392b;
            --error-text: #78281f;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --text-dark: #1a2a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 780px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(44, 73, 102, 0.12);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--bg-base);
            padding-bottom: 15px;
        }

        header .institution {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-main);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 1rem;
            color: var(--accent-main);
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            background-color: var(--bg-base);
            height: 10px;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-main);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-view {
            display: block;
        }

        .quiz-view.hidden {
            display: none;
        }

        .question-meta {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-main);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .options-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .option-item {
            background: var(--bg-base);
            border: 2px solid var(--accent-soft);
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .option-item:hover:not(.disabled) {
            background-color: var(--accent-soft);
            border-color: var(--accent-main);
        }

        .option-item.disabled {
            cursor: default;
        }

        .option-item.es-correcta {
            background-color: rgba(39, 174, 96, 0.2);
            border-color: var(--success);
            color: var(--success-text);
            font-weight: 600;
        }

        .option-item.es-incorrecta {
            background-color: rgba(192, 57, 43, 0.2);
            border-color: var(--error);
            color: var(--error-text);
            font-weight: 600;
        }

        .feedback-box {
            background-color: var(--bg-base);
            border-left: 5px solid var(--accent-main);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-dark);
        }

        .feedback-box.visible {
            display: block;
        }

        .feedback-box strong {
            color: var(--accent-main);
        }

        .btn-next {
            background-color: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            float: right;
            transition: background-color 0.2s;
            display: none;
        }

        .btn-next.visible {
            display: block;
        }

        .btn-next:hover {
            background-color: var(--text-primary);
        }

        .results-view {
            text-align: center;
            display: none;
        }

        .results-view.visible {
            display: block;
        }

        .results-view h2 {
            color: var(--text-primary);
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-main);
            margin: 20px 0;
        }

        .results-message {
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.6;
            color: var(--text-dark);
            text-align: justify;
        }

        .btn-restart {
            background-color: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-restart:hover {
            background-color: var(--text-primary);
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.3rem; }
            .container { padding: 20px; }
            .question-text { font-size: 1.05rem; }
            .score-display { font-size: 2.4rem; }
        }
    </style>
    <!-- MathJax 3 Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <div class="institution">Preparatoria Abierta</div>
            <h1>Simulador de Autoevaluación: Módulo 2</h1>
            <p>Sistemas de Ecuaciones Lineales con Dos Variables</p>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Vista del Quiz -->
        <div id="quizView" class="quiz-view clearfix">
            <div class="question-meta" id="questionMeta">Reactivo 1 de 10</div>
            <div class="question-text" id="questionText">Cargando pregunta...</div>
            <ul class="options-list" id="optionsList"></ul>
            <div class="feedback-box" id="feedbackBox"></div>
            <button class="btn-next" id="btnNext" onclick="nextQuestion()">Siguiente Reactivo →</button>
        </div>

        <!-- Vista de Resultados -->
        <div id="resultsView" class="results-view">
            <h2>Evaluación Finalizada</h2>
            <div class="score-display" id="finalScore">0/10</div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="btn-restart" onclick="restartQuiz()">Intentar de nuevo</button>
        </div>
    </div>

    <script>
        // =========================================
        // BANCO DE REACTIVOS — Módulo 2
        // =========================================
        const rawQuestions = [
            {
                id: 1,
                text: "¿Cuál es la interpretación geométrica del conjunto solución de un sistema de dos ecuaciones lineales con dos variables cuando las rectas se intersecan en un solo punto?",
                options: [
                    { text: "El sistema tiene infinitas soluciones porque las rectas son coincidentes.", correct: false },
                    { text: "El sistema no tiene solución porque las rectas son paralelas.", correct: false },
                    { text: "El sistema tiene una solución única, que corresponde al punto de intersección.", correct: true },
                    { text: "El sistema tiene exactamente dos soluciones, una por cada recta.", correct: false }
                ],
                feedback: "Cuando dos rectas se intersecan en un único punto, ese punto es la solución del sistema, ya que satisface simultáneamente ambas ecuaciones. Se dice que el sistema es consistente determinado."
            },
            {
                id: 2,
                text: "En un sistema de dos ecuaciones lineales, ¿qué característica deben tener las rectas para que el conjunto solución sea vacío?",
                options: [
                    { text: "Deben ser coincidentes, es decir, la misma recta.", correct: false },
                    { text: "Deben ser paralelas no coincidentes, con la misma pendiente pero distinta ordenada al origen.", correct: true },
                    { text: "Deben intersecarse en un solo punto.", correct: false },
                    { text: "Deben ser perpendiculares entre sí.", correct: false }
                ],
                feedback: "Cuando dos rectas son paralelas no coincidentes (misma pendiente, distinta ordenada al origen), nunca se intersecan, por lo que no existe ningún par ordenado que satisfaga ambas ecuaciones. El sistema es inconsistente y su conjunto solución es vacío."
            },
            {
                id: 3,
                text: "¿Cuál es la diferencia principal entre el método gráfico y los métodos algebraicos (suma/resta, sustitución, Cramer) para resolver un sistema de ecuaciones lineales?",
                options: [
                    { text: "El método gráfico da la solución exacta, mientras que los algebraicos dan soluciones aproximadas.", correct: false },
                    { text: "El método gráfico suele dar una solución aproximada, mientras que los algebraicos dan la solución exacta.", correct: true },
                    { text: "Ambos métodos siempre dan la solución exacta, sin ninguna diferencia.", correct: false },
                    { text: "El método gráfico solo funciona con sistemas consistentes.", correct: false }
                ],
                feedback: "El método gráfico localiza el punto de intersección visualmente, por lo que la solución suele ser aproximada, sobre todo si las coordenadas no son enteras. Los métodos algebraicos (suma/resta, sustitución, Cramer) permiten obtener la solución exacta mediante manipulaciones algebraicas."
            },
            {
                id: 4,
                text: "Al resolver el sistema $\\begin{cases} 3x + 2y = 5 \\\\ x + 3y = 4 \\end{cases}$ por el método de suma o resta, se obtiene $7x = 7$. ¿Cuál es la solución del sistema?",
                options: [
                    { text: "$x = 1$, $y = 1$", correct: true },
                    { text: "$x = 7$, $y = 7$", correct: false },
                    { text: "$x = 1$, $y = -1$", correct: false },
                    { text: "$x = -1$, $y = -1$", correct: false }
                ],
                feedback: "De $7x = 7$ se obtiene $x = 1$. Sustituyendo en la segunda ecuación: $1 + 3y = 4 \\Rightarrow 3y = 3 \\Rightarrow y = 1$. La solución es el par ordenado $(1, 1)$."
            },
            {
                id: 5,
                text: "Al aplicar la Regla de Cramer a un sistema $2 \\times 2$, ¿qué indica el hecho de que el determinante principal $\\Delta = 0$ y que $\\Delta_x \\neq 0$?",
                options: [
                    { text: "El sistema tiene solución única.", correct: false },
                    { text: "El sistema tiene infinitas soluciones (rectas coincidentes).", correct: false },
                    { text: "El sistema es inconsistente: las rectas son paralelas no coincidentes.", correct: true },
                    { text: "El sistema tiene exactamente dos soluciones.", correct: false }
                ],
                feedback: "Cuando $\\Delta = 0$ el sistema no tiene solución única. Si además $\\Delta_x \\neq 0$ (o $\\Delta_y \\neq 0$), el sistema es inconsistente, lo que geométricamente significa que las rectas son paralelas no coincidentes y nunca se intersecan."
            },
            {
                id: 6,
                text: "Se tiene el sistema $\\begin{cases} 2x + y = 4 \\\\ 4x + 2y = 8 \\end{cases}$. ¿Qué tipo de sistema es y cuántas soluciones tiene?",
                options: [
                    { text: "Sistema inconsistente; no tiene solución.", correct: false },
                    { text: "Sistema consistente determinado; tiene una solución única.", correct: false },
                    { text: "Sistema consistente indeterminado; tiene infinitas soluciones.", correct: true },
                    { text: "Sistema con exactamente dos soluciones.", correct: false }
                ],
                feedback: "La segunda ecuación es el doble de la primera ($2(2x + y) = 4x + 2y = 8$). Ambas representan la misma recta, por lo que todos los puntos de esa recta son solución. El sistema es consistente indeterminado y tiene infinitas soluciones."
            },
            {
                id: 7,
                text: "Al resolver un sistema por el método de sustitución, se despeja $x$ de la primera ecuación y se obtiene $x = 4 - 3y$. Si la segunda ecuación es $2x - y = -3$, ¿cuál es la ecuación resultante después de sustituir?",
                options: [
                    { text: "$2(4 - 3y) - y = -3$", correct: true },
                    { text: "$2(4) - 3y - y = -3$", correct: false },
                    { text: "$2(4 - 3y) + y = -3$", correct: false },
                    { text: "$4 - 3y - y = -3$", correct: false }
                ],
                feedback: "El método de sustitución consiste en reemplazar la expresión $x = 4 - 3y$ en la segunda ecuación. Esto da $2(4 - 3y) - y = -3$, que al resolver da $8 - 6y - y = -3 \\Rightarrow -7y = -11 \\Rightarrow y = \\frac{11}{7}$."
            },
            {
                id: 8,
                text: "Resolviendo el sistema $\\begin{cases} x + 2y = 4 \\\\ 5x - 2y = 2 \\end{cases}$ por el método de suma o resta, ¿qué ecuación se obtiene al sumar directamente ambas ecuaciones?",
                options: [
                    { text: "$6x = 6$", correct: true },
                    { text: "$4x = 6$", correct: false },
                    { text: "$6x = 2$", correct: false },
                    { text: "$4x = 2$", correct: false }
                ],
                feedback: "Al sumar directamente ambas ecuaciones, los términos en $y$ se cancelan: $(x + 5x) + (2y - 2y) = 4 + 2 \\Rightarrow 6x = 6 \\Rightarrow x = 1$. Sustituyendo en la primera ecuación: $1 + 2y = 4 \\Rightarrow y = \\frac{3}{2}$. La solución es $\\left(1, \\frac{3}{2}\\right)$."
            },
            {
                id: 9,
                text: "Se tiene el sistema $\\begin{cases} x - 2y = 1 \\\\ x - 2y = 0 \\end{cases}$. ¿Cuál es la naturaleza de este sistema?",
                options: [
                    { text: "Tiene una solución única.", correct: false },
                    { text: "Tiene infinitas soluciones porque las rectas son coincidentes.", correct: false },
                    { text: "Es inconsistente: las rectas son paralelas no coincidentes.", correct: true },
                    { text: "Tiene exactamente dos soluciones.", correct: false }
                ],
                feedback: "Ambas ecuaciones tienen la misma pendiente ($m = \\frac{1}{2}$) pero distinta ordenada al origen ($b = -\\frac{1}{2}$ y $b = 0$ respectivamente). Las rectas son paralelas no coincidentes, por lo que nunca se intersecan. El sistema es inconsistente y su conjunto solución es vacío."
            },
            {
                id: 10,
                text: "En el planteamiento de un problema, el perímetro de un rectángulo mide 26 metros y uno de sus lados es 3 metros más largo que el otro. Si $x$ es el lado menor y $y$ el lado mayor, ¿cuál es el sistema que modela correctamente la situación?",
                options: [
                    { text: "$\\begin{cases} 2x + 2y = 26 \\\\ y = x + 3 \\end{cases}$", correct: true },
                    { text: "$\\begin{cases} x + y = 26 \\\\ y = x + 3 \\end{cases}$", correct: false },
                    { text: "$\\begin{cases} 2x + 2y = 26 \\\\ x = y + 3 \\end{cases}$", correct: false },
                    { text: "$\\begin{cases} 2x + y = 26 \\\\ y = x - 3 \\end{cases}$", correct: false }
                ],
                feedback: "El perímetro de un rectángulo es $2x + 2y = 26$. La condición de que un lado es 3 metros más largo que el otro se expresa como $y = x + 3$. Resolviendo: $2x + 2(x + 3) = 26 \\Rightarrow 4x + 6 = 26 \\Rightarrow x = 5$, $y = 8$. Las dimensiones son 5 m y 8 m."
            }
        ];

        // =========================================
        // ESTADO DEL SIMULADOR
        // =========================================
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // =========================================
        // ALGORITMO FISHER-YATES
        // =========================================
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // =========================================
        // INICIALIZAR QUIZ
        // =========================================
        function initQuiz() {
            questions = shuffleArray(rawQuestions).map(q => {
                return {
                    ...q,
                    options: shuffleArray(q.options)
                };
            });
            currentQuestionIndex = 0;
            score = 0;
            answered = false;
            document.getElementById('resultsView').classList.remove('visible');
            document.getElementById('quizView').classList.remove('hidden');
            loadQuestion();
        }

        // =========================================
        // CARGAR PREGUNTA ACTUAL
        // =========================================
        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestionIndex];

            document.getElementById('questionMeta').innerText = `Reactivo ${currentQuestionIndex + 1} de 10`;
            document.getElementById('questionText').innerHTML = q.text;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `<strong>${String.fromCharCode(97 + idx)})</strong> ${opt.text}`;
                li.onclick = () => selectOption(opt.correct, li);
                optionsList.appendChild(li);
            });

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.className = 'feedback-box';
            feedbackBox.innerHTML = '';

            document.getElementById('btnNext').classList.remove('visible');
            updateProgress();

            if (window.MathJax) {
                MathJax.typeset();
            }
        }

        // =========================================
        // SELECCIONAR OPCIÓN Y MOSTRAR RETROALIMENTACIÓN
        // =========================================
        function selectOption(isCorrect, selectedElement) {
            if (answered) return;
            answered = true;

            const optionItems = document.querySelectorAll('.option-item');
            optionItems.forEach(item => {
                item.classList.add('disabled');
            });

            if (isCorrect) {
                selectedElement.classList.add('es-correcta');
                score++;
            } else {
                selectedElement.classList.add('es-incorrecta');
                const q = questions[currentQuestionIndex];
                optionItems.forEach((item, idx) => {
                    if (q.options[idx].correct) {
                        item.classList.add('es-correcta');
                    }
                });
            }

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.innerHTML = `<strong>Explicación:</strong> ${questions[currentQuestionIndex].feedback}`;
            feedbackBox.classList.add('visible');

            const btnNext = document.getElementById('btnNext');
            if (currentQuestionIndex === questions.length - 1) {
                btnNext.innerText = "Ver Resultados Finales →";
            } else {
                btnNext.innerText = "Siguiente Reactivo →";
            }
            btnNext.classList.add('visible');

            if (window.MathJax) {
                MathJax.typeset();
            }
        }

        // =========================================
        // SIGUIENTE PREGUNTA
        // =========================================
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // =========================================
        // ACTUALIZAR BARRA DE PROGRESO
        // =========================================
        function updateProgress() {
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        // =========================================
        // MOSTRAR RESULTADOS FINALES
        // =========================================
        function showResults() {
            document.getElementById('quizView').classList.add('hidden');
            document.getElementById('resultsView').classList.add('visible');
            document.getElementById('progressBar').style.width = '100%';

            document.getElementById('finalScore').innerText = `${score} / 10`;

            const msg = document.getElementById('resultsMessage');
            if (score === 10) {
                msg.innerText = "¡Excelente dominio! Has respondido correctamente todos los reactivos del Módulo 2 sobre sistemas de ecuaciones lineales con dos variables.";
            } else if (score >= 7) {
                msg.innerText = "¡Buen trabajo! Tienes una sólida comprensión de los métodos de solución de sistemas. Repasa algunos detalles sobre los tres casos de solución y el método de Cramer para alcanzar la perfección.";
            } else {
                msg.innerText = "Es recomendable repasar los conceptos teóricos y prácticos del Módulo 2 (los tres casos de solución, métodos gráfico, suma/resta, sustitución y Cramer) antes de intentar nuevamente.";
            }
        }

        // =========================================
        // REINICIAR QUIZ
        // =========================================
        function restartQuiz() {
            initQuiz();
        }

        // =========================================
        // INICIALIZACIÓN AL CARGAR
        // =========================================
        window.onload = initQuiz;
    </script>
</body>
</html>
