<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="tipo-recurso" content="Simulador de autoevaluación">
    <title>Simulador de Autoevaluación - Módulo 12: Sistemas de Ecuaciones Cuadráticas</title>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-base: #e8eef5;
            --accent-soft: #a9c1d9;
            --accent-main: #5b7fa3;
            --text-primary: #2c4966;
            --success: #27ae60;
            --success-text: #145a32;
            --error: #c0392b;
            --error-text: #78281f;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --text-dark: #1a2a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(44, 73, 102, 0.12);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--bg-base);
            padding-bottom: 15px;
        }

        header .institution {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-main);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            font-size: 1rem;
            color: var(--accent-main);
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            background-color: var(--bg-base);
            height: 10px;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-main);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-view { display: block; }
        .quiz-view.hidden { display: none; }

        .question-meta {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-main);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.12rem;
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .options-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .option-item {
            background: var(--bg-base);
            border: 2px solid var(--accent-soft);
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.8;
        }

        .option-item:hover:not(.disabled) {
            background-color: var(--accent-soft);
            border-color: var(--accent-main);
        }

        .option-item:focus {
            outline: 3px solid var(--accent-main);
            outline-offset: 2px;
        }

        .option-item.disabled { cursor: default; }

        .option-item.es-correcta {
            background-color: rgba(39, 174, 96, 0.2);
            border-color: var(--success);
            color: var(--success-text);
            font-weight: 600;
        }

        .option-item.es-incorrecta {
            background-color: rgba(192, 57, 43, 0.2);
            border-color: var(--error);
            color: var(--error-text);
            font-weight: 600;
        }

        .feedback-box {
            background-color: var(--bg-base);
            border-left: 5px solid var(--accent-main);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .feedback-box.visible { display: block; }
        .feedback-box strong { color: var(--accent-main); }

        .btn-next {
            background-color: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            float: right;
            transition: background-color 0.2s;
            display: none;
            font-family: inherit;
        }

        .btn-next.visible { display: block; }
        .btn-next:hover { background-color: var(--text-primary); }
        .btn-next:focus { outline: 3px solid var(--accent-main); outline-offset: 2px; }

        .results-view {
            text-align: center;
            display: none;
        }

        .results-view.visible { display: block; }

        .results-view h2 {
            color: var(--text-primary);
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-main);
            margin: 20px 0;
        }

        .results-message {
            font-size: 1.05rem;
            margin-bottom: 25px;
            line-height: 1.6;
            color: var(--text-dark);
            text-align: justify;
        }

        .btn-restart {
            background-color: var(--accent-main);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
        }

        .btn-restart:hover { background-color: var(--text-primary); }
        .btn-restart:focus { outline: 3px solid var(--accent-main); outline-offset: 2px; }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.1rem; }
            .container { padding: 20px; }
            .question-text { font-size: 1rem; }
            .score-display { font-size: 2.4rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="institution">Preparatoria Abierta</div>
            <h1>Simulador de Autoevaluación: Módulo 12</h1>
            <p>Sistemas de Ecuaciones Cuadráticas</p>
        </header>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar" role="progressbar" aria-label="Progreso del simulador" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>

        <div id="quizView" class="quiz-view clearfix">
            <div class="question-meta" id="questionMeta">Reactivo 1 de 10</div>
            <div class="question-text" id="questionText">Cargando pregunta...</div>
            <ul class="options-list" id="optionsList" role="list"></ul>
            <div class="feedback-box" id="feedbackBox" role="status" aria-live="polite"></div>
            <button class="btn-next" id="btnNext" onclick="nextQuestion()" aria-label="Avanzar al siguiente reactivo">Siguiente Reactivo →</button>
        </div>

        <div id="resultsView" class="results-view">
            <h2>Evaluación Finalizada</h2>
            <div class="score-display" id="finalScore">0/10</div>
            <div class="results-message" id="resultsMessage"></div>
            <button class="btn-restart" onclick="restartQuiz()" aria-label="Reiniciar la evaluación">Intentar de nuevo</button>
        </div>
    </div>

    <script>
        // =========================================
        // BANCO DE REACTIVOS — Módulo 12
        // =========================================
        const rawQuestions = [
            {
                id: 1,
                text: "¿Cuál es el conjunto solución del sistema $\\begin{cases} y = x^2 - 6x + 5 \\\\ y = 2x - 7 \\end{cases}$?",
                options: [
                    { text: "$\\{(2, -3), (6, 5)\\}$", correct: true },
                    { text: "$\\{(3, -4), (5, 3)\\}$", correct: false },
                    { text: "$\\{(2, -3)\\}$", correct: false },
                    { text: "$\\{(6, 5)\\}$", correct: false }
                ],
                feedback: "Igualamos las expresiones de $y$: $x^2 - 6x + 5 = 2x - 7 \\Rightarrow x^2 - 8x + 12 = 0 \\Rightarrow (x - 2)(x - 6) = 0$. Para $x=2$: $y = -3$. Para $x=6$: $y = 5$. Solución: $\\{(2, -3), (6, 5)\\}$."
            },
            {
                id: 2,
                text: "Al resolver el sistema $\\begin{cases} x^2 - x - y - 6 = 0 \\\\ 2x - y - 2 = 0 \\end{cases}$ por sustitución, ¿qué ecuación cuadrática resulta?",
                options: [
                    { text: "$x^2 - 3x - 4 = 0$", correct: true },
                    { text: "$x^2 - 3x + 4 = 0$", correct: false },
                    { text: "$x^2 + 3x - 4 = 0$", correct: false },
                    { text: "$x^2 - x - 8 = 0$", correct: false }
                ],
                feedback: "Despejando $y = 2x - 2$ de la segunda y sustituyendo: $x^2 - x - (2x - 2) - 6 = 0 \\Rightarrow x^2 - 3x - 4 = 0$. Factorizando: $(x - 4)(x + 1) = 0 \\Rightarrow x = 4, x = -1$."
            },
            {
                id: 3,
                text: "¿Cuál es el conjunto solución del sistema $\\begin{cases} x^2 + y^2 = 25 \\\\ x + y = 1 \\end{cases}$?",
                options: [
                    { text: "$\\{(4, -3), (-3, 4)\\}$", correct: true },
                    { text: "$\\{(4, 3), (3, 4)\\}$", correct: false },
                    { text: "$\\{(-4, 3), (3, -4)\\}$", correct: false },
                    { text: "$\\{(5, -4), (-4, 5)\\}$", correct: false }
                ],
                feedback: "Despejando $y = 1 - x$ y sustituyendo: $x^2 + (1 - x)^2 = 25 \\Rightarrow 2x^2 - 2x + 1 = 25 \\Rightarrow x^2 - x - 12 = 0 \\Rightarrow (x - 4)(x + 3) = 0$. Para $x=4$: $y = -3$. Para $x=-3$: $y = 4$. Solución: $\\{(4, -3), (-3, 4)\\}$."
            },
            {
                id: 4,
                text: "Al resolver el sistema $\\begin{cases} x^2 + y^2 = 25 \\\\ 4x^2 - 4y^2 = 36 \\end{cases}$ por suma, ¿cuál es el valor de $x^2$?",
                options: [
                    { text: "$x^2 = 17$", correct: true },
                    { text: "$x^2 = 8$", correct: false },
                    { text: "$x^2 = 25$", correct: false },
                    { text: "$x^2 = 4$", correct: false }
                ],
                feedback: "Multiplicando la primera por 4: $4x^2 + 4y^2 = 100$. Sumando con la segunda: $8x^2 = 136 \\Rightarrow x^2 = 17$. Sustituyendo en la primera: $17 + y^2 = 25 \\Rightarrow y^2 = 8$."
            },
            {
                id: 5,
                text: "Al resolver el sistema $\\begin{cases} 2x^2 + 4y^2 = 20 \\\\ x^2 - 2y^2 = 50 \\end{cases}$, ¿qué tipo de solución se obtiene?",
                options: [
                    { text: "Solución compleja: $y = \\pm i\\sqrt{10}$, $x = \\pm\\sqrt{30}$", correct: true },
                    { text: "Solución real: $x = \\pm 5$, $y = \\pm 2$", correct: false },
                    { text: "Solución única: $x = 5$, $y = 0$", correct: false },
                    { text: "No tiene solución de ningún tipo", correct: false }
                ],
                feedback: "Despejando $x^2 = 50 + 2y^2$ y sustituyendo: $2(50 + 2y^2) + 4y^2 = 20 \\Rightarrow 8y^2 = -80 \\Rightarrow y^2 = -10$. Como $y^2 < 0$, $y = \\pm i\\sqrt{10}$ (complejas). Sustituyendo: $x^2 - 2(-10) = 50 \\Rightarrow x^2 = 30 \\Rightarrow x = \\pm\\sqrt{30}$."
            },
            {
                id: 6,
                text: "Al resolver el sistema $\\begin{cases} x^2 + 3xy + x = -3 \\\\ xy + 2x = -3 \\end{cases}$, ¿qué ecuación se obtiene al eliminar el término $xy$?",
                options: [
                    { text: "$x^2 - 5x - 6 = 0$", correct: true },
                    { text: "$x^2 - 5x + 6 = 0$", correct: false },
                    { text: "$x^2 + 5x - 6 = 0$", correct: false },
                    { text: "$x^2 - x - 6 = 0$", correct: false }
                ],
                feedback: "Multiplicando la segunda por $-3$: $-3xy - 6x = 9$. Sumando con la primera: $x^2 + 3xy + x - 3xy - 6x = -3 + 9 \\Rightarrow x^2 - 5x = 6 \\Rightarrow x^2 - 5x - 6 = 0$. Factorizando: $(x - 6)(x + 1) = 0$."
            },
            {
                id: 7,
                text: "Al resolver el sistema homogéneo $\\begin{cases} x^2 + 2xy - 4y^2 = 18 \\\\ 2x^2 + 7xy + 4y^2 = 104 \\end{cases}$, después de eliminar el término constante se obtiene una ecuación que factoriza como:",
                options: [
                    { text: "$(3x + 10y)(x - 2y) = 0$", correct: true },
                    { text: "$(3x - 10y)(x + 2y) = 0$", correct: false },
                    { text: "$(x + 5y)(3x - 2y) = 0$", correct: false },
                    { text: "$(2x + 5y)(3x - y) = 0$", correct: false }
                ],
                feedback: "Al eliminar el término constante se obtiene $3x^2 + 4xy - 20y^2 = 0$, que factoriza como $(3x + 10y)(x - 2y) = 0$. De aquí: $x = -10y/3$ ó $x = 2y$. Sustituyendo cada caso en la ecuación (1) se obtienen las soluciones $(-20, 6), (20, -6), (4, 2), (-4, -2)$."
            },
            {
                id: 8,
                text: "¿Cuál es el conjunto solución del sistema $\\begin{cases} 5x^2 - 11y^2 = 69 \\\\ 2x^2 - 7y^2 = 25 \\end{cases}$?",
                options: [
                    { text: "$\\{(4, 1), (4, -1), (-4, 1), (-4, -1)\\}$", correct: true },
                    { text: "$\\{(4, 1), (-4, -1)\\}$", correct: false },
                    { text: "$\\{(2, 1), (-2, -1)\\}$", correct: false },
                    { text: "$\\{(4, 2), (-4, -2)\\}$", correct: false }
                ],
                feedback: "Despejando $x^2 = (25 + 7y^2)/2$ y sustituyendo: $5(25 + 7y^2)/2 - 11y^2 = 69 \\Rightarrow 13y^2 = 13 \\Rightarrow y^2 = 1$. Sustituyendo: $2x^2 - 7 = 25 \\Rightarrow x^2 = 16$. Combinando: $(4, 1), (4, -1), (-4, 1), (-4, -1)$."
            },
            {
                id: 9,
                text: "Si el discriminante de la ecuación cuadrática que resulta al resolver un sistema cuadrática-lineal es negativo, ¿qué se concluye sobre el sistema?",
                options: [
                    { text: "El sistema no tiene soluciones reales; la recta y la parábola no se intersecan.", correct: true },
                    { text: "El sistema tiene una solución única.", correct: false },
                    { text: "El sistema tiene infinitas soluciones.", correct: false },
                    { text: "El sistema tiene dos soluciones reales.", correct: false }
                ],
                feedback: "Cuando $\\Delta < 0$ en la ecuación cuadrática resultante, no hay soluciones reales para la variable de la parábola. Geométricamente, la recta y la parábola no se intersecan en el plano real."
            },
            {
                id: 10,
                text: "¿Cuántas soluciones reales tiene un sistema del tipo $ax^2 + by^2 = c$ (con dos ecuaciones de este tipo) cuando tanto $x^2$ como $y^2$ resultan positivos?",
                options: [
                    { text: "Cuatro soluciones, combinando todos los signos de $x$ e $y$.", correct: true },
                    { text: "Una solución única.", correct: false },
                    { text: "Dos soluciones, solo con signos positivos.", correct: false },
                    { text: "Ninguna solución real.", correct: false }
                ],
                feedback: "Cuando $x^2 > 0$ y $y^2 > 0$, cada variable tiene dos posibles valores ($\\pm$), lo que da $2 \\times 2 = 4$ combinaciones posibles: $(x, y), (x, -y), (-x, y), (-x, -y)$."
            }
        ];

        // =========================================
        // ESTADO DEL SIMULADOR
        // =========================================
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // =========================================
        // ALGORITMO FISHER-YATES
        // =========================================
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // =========================================
        // RENDERIZAR MATHJAX
        // =========================================
        function renderMath(element) {
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise(element ? [element] : undefined).catch(function(err){ console.log(err); });
            } else if (window.MathJax && window.MathJax.typeset) {
                MathJax.typeset();
            }
        }

        // =========================================
        // LIMPIAR LATEX PARA ARIA-LABEL
        // =========================================
        function limpiarLatex(texto) {
            return String(texto)
                .replace(/\$[^$]*\$/g, '')
                .replace(/\\[a-zA-Z]+/g, '')
                .replace(/[{}]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // =========================================
        // INICIALIZAR QUIZ
        // =========================================
        function initQuiz() {
            questions = shuffleArray(rawQuestions).map(q => {
                return {
                    ...q,
                    options: shuffleArray(q.options)
                };
            });
            currentQuestionIndex = 0;
            score = 0;
            answered = false;
            document.getElementById('resultsView').classList.remove('visible');
            document.getElementById('quizView').classList.remove('hidden');
            loadQuestion();
        }

        // =========================================
        // CARGAR PREGUNTA ACTUAL
        // =========================================
        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestionIndex];

            document.getElementById('questionMeta').innerText = `Reactivo ${currentQuestionIndex + 1} de 10`;
            document.getElementById('questionText').innerHTML = q.text;

            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.setAttribute('role', 'button');
                li.setAttribute('tabindex', '0');
                li.setAttribute('aria-label', `Opción ${String.fromCharCode(97 + idx)}: ${limpiarLatex(opt.text)}`);
                li.innerHTML = `<strong>${String.fromCharCode(97 + idx)})</strong> ${opt.text}`;

                li.onclick = () => selectOption(opt.correct, li);

                li.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectOption(opt.correct, li);
                    }
                };

                optionsList.appendChild(li);
            });

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.className = 'feedback-box';
            feedbackBox.innerHTML = '';

            document.getElementById('btnNext').classList.remove('visible');
            updateProgress();

            renderMath(document.getElementById('quizView'));
        }

        // =========================================
        // SELECCIONAR OPCIÓN Y MOSTRAR RETROALIMENTACIÓN
        // =========================================
        function selectOption(isCorrect, selectedElement) {
            if (answered) return;
            answered = true;

            const optionItems = document.querySelectorAll('.option-item');
            optionItems.forEach(item => {
                item.classList.add('disabled');
                item.setAttribute('tabindex', '-1');
                item.setAttribute('aria-disabled', 'true');
            });

            if (isCorrect) {
                selectedElement.classList.add('es-correcta');
                selectedElement.setAttribute('aria-label', 'Opción correcta');
                score++;
            } else {
                selectedElement.classList.add('es-incorrecta');
                selectedElement.setAttribute('aria-label', 'Opción incorrecta');
                const q = questions[currentQuestionIndex];
                optionItems.forEach((item, idx) => {
                    if (q.options[idx].correct) {
                        item.classList.add('es-correcta');
                    }
                });
            }

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.innerHTML = `<strong>Explicación:</strong> ${questions[currentQuestionIndex].feedback}`;
            feedbackBox.classList.add('visible');

            const btnNext = document.getElementById('btnNext');
            if (currentQuestionIndex === questions.length - 1) {
                btnNext.innerText = "Ver Resultados Finales →";
                btnNext.setAttribute('aria-label', 'Ver resultados finales');
            } else {
                btnNext.innerText = "Siguiente Reactivo →";
                btnNext.setAttribute('aria-label', 'Avanzar al siguiente reactivo');
            }
            btnNext.classList.add('visible');
            btnNext.focus();

            renderMath(document.getElementById('quizView'));
        }

        // =========================================
        // SIGUIENTE PREGUNTA
        // =========================================
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // =========================================
        // ACTUALIZAR BARRA DE PROGRESO
        // =========================================
        function updateProgress() {
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            const bar = document.getElementById('progressBar');
            bar.style.width = `${progress}%`;
            bar.setAttribute('aria-valuenow', Math.round(progress));
        }

        // =========================================
        // MOSTRAR RESULTADOS FINALES
        // =========================================
        function showResults() {
            document.getElementById('quizView').classList.add('hidden');
            document.getElementById('resultsView').classList.add('visible');
            const bar = document.getElementById('progressBar');
            bar.style.width = '100%';
            bar.setAttribute('aria-valuenow', '100');

            document.getElementById('finalScore').innerText = `${score} / 10`;

            const msg = document.getElementById('resultsMessage');
            if (score === 10) {
                msg.innerText = "¡Excelente dominio! Has respondido correctamente todos los reactivos del Módulo 12 sobre sistemas de ecuaciones cuadráticas: cuadrática-lineal, del tipo ax² + by² = c, y del tipo ax² + bxy + cy² = d.";
            } else if (score >= 7) {
                msg.innerText = "¡Buen trabajo! Tienes una sólida comprensión de los métodos de solución de sistemas cuadráticos. Repasa los detalles sobre sistemas homogéneos y soluciones complejas para alcanzar la perfección.";
            } else {
                msg.innerText = "Es recomendable repasar los conceptos del Módulo 12: método gráfico, sustitución, suma/resta, y el algoritmo de eliminación de constante y factorización para sistemas homogéneos. Vuelve a intentarlo.";
            }

            renderMath(document.getElementById('resultsView'));
        }

        // =========================================
        // REINICIAR QUIZ
        // =========================================
        function restartQuiz() {
            initQuiz();
        }

        // =========================================
        // INICIALIZACIÓN
        // =========================================
        window.onload = initQuiz;
    </script>
</body>
</html>
